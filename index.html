        <h2 id="next-title">次の一手</h2>
      </div>
      <div class="stack" id="nextList"></div>
    </section>

    <section class="panel" aria-labelledby="schedule-title">
      <div class="section-heading">
        <h2 id="schedule-title">今後の予定</h2>
      </div>
      <div class="timeline" id="scheduleList"></div>
    </section>

    <section class="panel warning-panel" aria-labelledby="issues-title">
      <div class="section-heading">
        <h2 id="issues-title">未解決事項</h2>
        <span class="count-pill" id="issueCount"></span>
      </div>
      <div class="stack" id="issueList"></div>
    </section>

    <p class="privacy-note">このダッシュボードには、氏名・連絡先・医療情報などの個人情報は掲載していません。</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
