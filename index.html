<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>はまはっぴー・えん 開設準備</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <img class="brand-logo" src="./hamahappy-logo.png" alt="はまはっぴー" />
        <div class="brand-copy">
          <p class="eyebrow">開設準備ダッシュボード</p>
          <h1>はまはっぴー・えん</h1>
        </div>
      </div>
      <span class="dummy-badge">開設準備中</span>
    </header>

    <section class="hero-card">
      <p class="label">開所予定日</p>
      <p class="open-date" id="openDate"></p>
      <div class="progress-row">
        <div>
          <span class="muted">準備進捗</span>
          <strong id="overallProgress"></strong>
        </div>
        <div class="progress-track" aria-label="準備進捗">
          <span id="overallProgressBar"></span>
        </div>
      </div>
    </section>



    <section class="panel properties-panel" aria-labelledby="properties-title">
      <div class="section-heading">
        <h2 id="properties-title">現在の物件候補</h2>
        <span class="count-pill">3候補</span>
      </div>
      <div class="property-list" id="propertyCandidates"></div>
    </section>

    <section class="panel property-photo-panel" aria-labelledby="property-photo-title">
      <div class="section-heading">
        <h2 id="property-photo-title">内野2395 現地写真</h2>
        <span class="muted">物件候補</span>
      </div>
      <img class="property-photo" src="./assets/uchino2395-web.jpg" alt="浜名区内野2395周辺の物件写真" />
      <p class="photo-caption">浜名区内野2395の候補物件。周辺の土地利用・分筆・浄化槽・必要工事とあわせて検討中です。</p>
    </section>

    <section class="panel operating-panel" aria-labelledby="operating-title">
      <div class="section-heading">
        <h2 id="operating-title">開所時の運営モデル</h2>
        <span class="count-pill">方針整理中</span>
      </div>
      <div class="model-grid" id="operatingModel"></div>
    </section>

    <section class="panel finance-panel" aria-labelledby="finance-title">
      <div class="section-heading">
        <h2 id="finance-title">資金概算</h2>
        <span class="muted">現時点</span>
      </div>
      <div class="finance-grid" id="financeSummary"></div>
    </section>

    <section aria-labelledby="status-title">
      <div class="section-heading">
        <h2 id="status-title">準備状況</h2>
        <span class="muted">4項目</span>
      </div>
      <div class="status-grid" id="statusGrid"></div>
    </section>

    <section class="panel next-panel" aria-labelledby="next-title">
      <div class="section-heading">
        <h2 id="next-title">次の一手</h2>
      </div>
      <div class="stack" id="nextList"></div>
    </section>

    <section class="panel" aria-labelledby="schedule-title">
      <div class="section-heading">
        <h2 id="schedule-title">今後の予定</h2>
      </div>
      <div class="timeline" id="scheduleList"></div>
    </section>

    <section class="panel warning-panel" aria-labelledby="issues-title">
      <div class="section-heading">
        <h2 id="issues-title">未解決事項</h2>
        <span class="count-pill" id="issueCount"></span>
      </div>
      <div class="stack" id="issueList"></div>
    </section>

    <p class="privacy-note">このダッシュボードには、個別給与・連絡先・医療情報・個人の詳細な勤務制約などの機微な情報は掲載していません。</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
