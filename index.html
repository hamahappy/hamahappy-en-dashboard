<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>はまはっぴー・えん 開設準備</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">開設準備ダッシュボード</p>
        <h1>はまはっぴー・えん</h1>
      </div>
      <span class="dummy-badge">ダミーデータ</span>
    </header>

    <section class="hero-card">
      <p class="label">開所予定日</p>
      <p class="open-date" id="openDate"></p>
      <div class="progress-row">
        <div>
          <span class="muted">準備進捗</span>
          <strong id="overallProgress"></strong>
        </div>
        <div class="progress-track" aria-label="準備進捗">
          <span id="overallProgressBar"></span>
        </div>
      </div>
    </section>

    <section aria-labelledby="status-title">
      <div class="section-heading">
        <h2 id="status-title">準備状況</h2>
        <span class="muted">4項目</span>
      </div>
      <div class="status-grid" id="statusGrid"></div>
    </section>

    <section class="panel" aria-labelledby="schedule-title">
      <div class="section-heading">
        <h2 id="schedule-title">今後の予定</h2>
      </div>
      <div class="timeline" id="scheduleList"></div>
    </section>

    <section class="panel warning-panel" aria-labelledby="issues-title">
      <div class="section-heading">
        <h2 id="issues-title">未解決事項</h2>
        <span class="count-pill" id="issueCount"></span>
      </div>
      <div class="stack" id="issueList"></div>
    </section>

    <section class="panel next-panel" aria-labelledby="next-title">
      <div class="section-heading">
        <h2 id="next-title">次の一手</h2>
      </div>
      <div class="stack" id="nextList"></div>
    </section>

    <p class="privacy-note">この画面はデモ用です。氏名・連絡先・医療情報などの個人情報は含んでいません。</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
